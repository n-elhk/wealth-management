[package]
name = "wealth-management"
version = "0.1.0"
description = "Wealth Management — gestion de patrimoine personnel et de SCI"
authors = ["Nicolas El-Hayek"]
edition = "2021"
rust-version = "1.80"

[lib]
# `staticlib` et `cdylib` sont requis pour les cibles mobiles (iOS / Android).
name = "wealth_management_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
